name: CI

on:
  push:
    branches: [main, safecore-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Public repository guard
        run: node scripts/check-public-repo.js
      - name: Install
        run: npm install
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Compile
        run: npm run compile
      - name: UQX and SafeCore tests
        run: npm test
